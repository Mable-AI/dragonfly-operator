# Mable fork: build the operator image and push it to the GCP registry.
# Modeled on Mable-AI/devops-docs build-and-push.yml.
# - push to the fork branch -> dev registry only
# - manual dispatch         -> dev (default) or prod registry

name: Build and Push Docker Image

on:
  push:
    branches:
      - termination-grace-period
  workflow_dispatch:
    inputs:
      environment:
        description: Registry to push to
        type: choice
        options:
          - dev
          - prod
        default: dev

env:
  DOCKER_IMAGE_TAG: ${{ github.sha }}
  # GCP_REGISTRY_PROJECT_ID_*/GCP_SA_REGISTRY_WRITE_BASE64_* are org secrets shared with devops-docs
  GCP_REGISTRY: ${{ secrets.GCP_REGISTRY_EUWEST3_URL }}/${{ inputs.environment == 'prod' && secrets.GCP_REGISTRY_PROJECT_ID_PROD || secrets.GCP_REGISTRY_PROJECT_ID_DEV }}/mable
  GCP_SA_KEY_BASE64: ${{ inputs.environment == 'prod' && secrets.GCP_SA_REGISTRY_WRITE_BASE64_PROD || secrets.GCP_SA_REGISTRY_WRITE_BASE64_DEV }}
  IMAGE_NAME: dragonfly-operator

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubicloud-standard-4
          - architecture: arm64
            runner: ubicloud-standard-4-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}-${{ matrix.architecture }} .

      - name: Login to GCP Registry and Push
        run: |
          echo "$GCP_SA_KEY_BASE64" | base64 -d | docker login -u _json_key --password-stdin ${{ secrets.GCP_REGISTRY_EUWEST3_URL }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}-${{ matrix.architecture }} \
            ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}-${{ matrix.architecture }}
          docker push ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}-${{ matrix.architecture }}

  create-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubicloud-standard-4
    needs: build-and-push
    steps:
      - name: Setup Docker experimental features
        run: |
          mkdir -p ~/.docker
          echo '{"experimental": "enabled"}' > ~/.docker/config.json

      - name: Login to GCP Registry
        run: |
          echo "$GCP_SA_KEY_BASE64" | base64 -d | docker login -u _json_key --password-stdin ${{ secrets.GCP_REGISTRY_EUWEST3_URL }}

      - name: Create and push manifest
        run: |
          IMG=${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          docker manifest create $IMG $IMG-amd64 $IMG-arm64
          docker manifest annotate $IMG $IMG-amd64 --os linux --arch amd64
          docker manifest annotate $IMG $IMG-arm64 --os linux --arch arm64
          docker manifest push $IMG
          echo "Pushed $IMG" >> "$GITHUB_STEP_SUMMARY"
